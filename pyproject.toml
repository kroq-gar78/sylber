[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sylber"
version = "0.1.2"
description = "Python code for \"Sylber: Syllabic Embedding Representation of Speech from Raw Audio\""
readme = "README.md"
requires-python = ">=3.8"
license = {text = "Apache-2.0"}
authors = [
    {name = "Cheol Jun Cho", email = "cheoljun@berkeley.edu"},
    {name = "Nicholas Lee"},
    {name = "Akshat Gupta"},
    {name = "Dhruv Agarwal"},
    {name = "Ethan Chen"},
    {name = "Alan Black"},
    {name = "Gopala Anumanchipalli"},
]
keywords = ["speech", "audio", "embedding", "syllabic"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy",
    "soundfile",
    "librosa",
    "torch",
    "torchaudio",
    "transformers",
    "huggingface-hub",
    "tqdm",
    "speech-articulatory-coding",
    "typeguard>=4.0.1",
    "torchode==1.0.0",
    "torchdiffeq==0.2.4",
    "beartype==0.19.0",
    "gateloop-transformer==0.2.5",
    "vector-quantize-pytorch==1.18.5",
]

[project.urls]
Homepage = "https://github.com/Berkeley-Speech-Group/sylber"
Repository = "https://github.com/Berkeley-Speech-Group/sylber"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["sylber*"]
